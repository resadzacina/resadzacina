name: Refresh archive

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Scan watched feeds
        run: node scripts/scan.mjs
      - name: Refresh GitHub archive
        run: node scripts/build.mjs
      - name: Commit if new mentions were found
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json site-media/catalog.json README.md ARCHIVE.md
          if git diff --staged --quiet; then
            echo "No catalog changes"
          else
            git commit -m "Refresh GitHub archive from watched feeds"
            git push
          fi
